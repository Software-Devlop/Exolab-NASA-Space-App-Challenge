name: exolab
description: "A new Flutter project."
publish_to: "none" # Remove this line if you wish to publish to pub.dev
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  dartz: ^0.10.1
  flutter_svg: ^2.3.0
  intl: ^0.20.3
  custom_masonry_grid: ^1.0.4
  flutter_riverpod: ^3.3.2
  flutter_markdown_plus: ^1.0.12
  window_manager: ^0.5.2
  flutter_scene: ^0.24.3
  flutter_native_splash: ^2.4.8
  flutter_launcher_icons: ^0.14.4
  file_picker: ^13.3.0
  path_provider: ^2.1.6
  llamadart: ^0.17.2
  flutter_litert: ^3.9.4
  syncfusion_flutter_datepicker: ^35.1.43
  sqflite_common_ffi: ^2.4.7
  sqlite3_flutter_libs: ^0.6.0+eol

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/icons/
    - assets/images/
    - assets/fonts/
    - assets/glb/
    - assets/models/
    - flutter_scene_generated/
    - path: flutter_scene_generated/metal_ios/
      platforms:
        - ios
    - path: flutter_scene_generated/metal_desktop/
      platforms:
        - macos
    - path: flutter_scene_generated/opengl_es_vulkan/
      platforms:
        - android
        - linux
        - windows
    - path: flutter_scene_generated/opengl_es/
      platforms:
        - web

  fonts:
    - family: Inter
      fonts:
        # Thin (100)
        - asset: assets/fonts/Inter/Inter_18pt-Thin.ttf
          weight: 100
        - asset: assets/fonts/Inter/Inter_18pt-ThinItalic.ttf
          weight: 100
          style: italic

        # ExtraLight (200)
        - asset: assets/fonts/Inter/Inter_18pt-ExtraLight.ttf
          weight: 200
        - asset: assets/fonts/Inter/Inter_18pt-ExtraLightItalic.ttf
          weight: 200
          style: italic

        # Light (300)
        - asset: assets/fonts/Inter/Inter_18pt-Light.ttf
          weight: 300
        - asset: assets/fonts/Inter/Inter_18pt-LightItalic.ttf
          weight: 300
          style: italic

        # Regular / Normal (400)
        - asset: assets/fonts/Inter/Inter_18pt-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter/Inter_18pt-Italic.ttf
          weight: 400
          style: italic

        # Medium (500)
        - asset: assets/fonts/Inter/Inter_18pt-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter/Inter_18pt-MediumItalic.ttf
          weight: 500
          style: italic

        # SemiBold (600)
        - asset: assets/fonts/Inter/Inter_18pt-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter/Inter_18pt-SemiBoldItalic.ttf
          weight: 600
          style: italic

        # Bold (700)
        - asset: assets/fonts/Inter/Inter_18pt-Bold.ttf
          weight: 700
        - asset: assets/fonts/Inter/Inter_18pt-BoldItalic.ttf
          weight: 700
          style: italic

        # ExtraBold (800)
        - asset: assets/fonts/Inter/Inter_18pt-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/Inter/Inter_18pt-ExtraBoldItalic.ttf
          weight: 800
          style: italic

        # Black (900)
        - asset: assets/fonts/Inter/Inter_18pt-Black.ttf
          weight: 900
        - asset: assets/fonts/Inter/Inter_18pt-BlackItalic.ttf
          weight: 900
          style: italic

flutter_launcher_icons:
  android: true
  ios: true

  image_path: "assets/icons/exolab.png"

  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icons/exolab.png"
  adaptive_icon_foreground_inset: 16

flutter_native_splash:
  color: "#FFFFFF"
  image: assets/icons/exolab.png

  android: true
  ios: true

  android_12:
    color: "#FFFFFF"
    image: assets/icons/exolab.png
    icon_background_color: "#FFFFFF"
